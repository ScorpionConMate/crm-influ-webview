<!DOCTYPE html>

<html class="" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>New Deal: Deliverables</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13c8ec",
                        "background-light": "#f6f8f8",
                        "background-dark": "#101f22",
                        "surface-dark": "#172a2d",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2D3E42;
            border-radius: 4px;
        }
        
        /* Hide number input arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white h-screen flex flex-col overflow-hidden">
<!-- Header -->
<div class="flex items-center justify-between p-4 pb-2 bg-background-light dark:bg-background-dark shrink-0 z-10">
<button class="text-slate-900 dark:text-white flex size-10 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">New Deal</h2>
<div class="flex w-10 items-center justify-end">
<button class="text-slate-500 dark:text-[#9db4b9] text-sm font-semibold leading-normal hover:text-primary transition-colors">Cancel</button>
</div>
</div>
<!-- Progress Indicator -->
<div class="flex w-full flex-col items-center justify-center gap-2 py-2 px-6 shrink-0 bg-background-light dark:bg-background-dark">
<div class="flex w-full gap-2">
<div class="h-1 flex-1 rounded-full bg-primary"></div>
<div class="h-1 flex-1 rounded-full bg-primary"></div>
<div class="h-1 flex-1 rounded-full bg-slate-200 dark:bg-[#2A3B3E]"></div>
<div class="h-1 flex-1 rounded-full bg-slate-200 dark:bg-[#2A3B3E]"></div>
</div>
<span class="text-xs font-medium text-slate-500 dark:text-[#9db4b9]">Step 2 of 4</span>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-4 pb-24 pt-4">
<!-- Screen Title -->
<div class="mb-6">
<h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white mb-1">Deliverables</h1>
<p class="text-slate-500 dark:text-[#9db4b9] text-sm">Define the scope of work and deadlines for this campaign.</p>
</div>
<!-- Deliverable Card 1 (Repeater Item) -->
<div class="bg-white dark:bg-surface-dark rounded-xl p-5 mb-4 shadow-sm border border-slate-100 dark:border-white/5 relative group">
<!-- Card Header -->
<div class="flex justify-between items-center mb-5">
<div class="flex items-center gap-2">
<span class="bg-primary/10 text-primary p-1.5 rounded-lg">
<span class="material-symbols-outlined text-[20px]">inventory_2</span>
</span>
<h3 class="font-semibold text-slate-900 dark:text-white">Deliverable #1</h3>
</div>
<button class="text-slate-400 hover:text-red-500 transition-colors">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<!-- Form Fields -->
<div class="space-y-4">
<!-- Content Type -->
<div class="space-y-1.5">
<label class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Content Type</label>
<div class="relative">
<select class="w-full appearance-none rounded-lg bg-slate-50 dark:bg-[#101f22] border-none py-3 pl-4 pr-10 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary text-sm font-medium">
<option>Instagram Post</option>
<option>Instagram Story</option>
<option>TikTok Video</option>
<option>YouTube Integration</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Row: Quantity & Deadline -->
<div class="grid grid-cols-2 gap-4">
<!-- Quantity Stepper -->
<div class="space-y-1.5">
<label class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Quantity</label>
<div class="flex items-center justify-between rounded-lg bg-slate-50 dark:bg-[#101f22] p-1 h-[46px]">
<button class="flex size-9 items-center justify-center rounded-md bg-white dark:bg-[#1E2D30] text-slate-500 dark:text-slate-300 shadow-sm hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm">remove</span>
</button>
<span class="font-semibold text-slate-900 dark:text-white">1</span>
<button class="flex size-9 items-center justify-center rounded-md bg-white dark:bg-[#1E2D30] text-slate-500 dark:text-slate-300 shadow-sm hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm">add</span>
</button>
</div>
</div>
<!-- Date Picker -->
<div class="space-y-1.5">
<label class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Deadline</label>
<div class="relative">
<input class="w-full rounded-lg bg-slate-50 dark:bg-[#101f22] border-none py-3 pl-10 pr-4 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary text-sm font-medium h-[46px] appearance-none" placeholder="Select date" type="date"/>
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-3 text-slate-500">
<span class="material-symbols-outlined text-[18px]">calendar_today</span>
</div>
</div>
</div>
</div>
<!-- Business Requirements -->
<div class="space-y-1.5">
<label class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Business Requirements</label>
<textarea class="w-full rounded-lg bg-slate-50 dark:bg-[#101f22] border-none p-3 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary text-sm font-normal resize-none placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="e.g. Must mention promo code 'SUMMER24' in the first 15 seconds..." rows="3"></textarea>
</div>
</div>
</div>
<!-- Deliverable Card 2 (Collapsed/Mini state example or just another card) -->
<div class="bg-white dark:bg-surface-dark rounded-xl p-5 mb-4 shadow-sm border border-slate-100 dark:border-white/5 relative opacity-60 hover:opacity-100 transition-opacity">
<div class="flex justify-between items-center mb-5">
<div class="flex items-center gap-2">
<span class="bg-slate-100 dark:bg-white/5 text-slate-500 dark:text-slate-400 p-1.5 rounded-lg">
<span class="material-symbols-outlined text-[20px]">movie</span>
</span>
<h3 class="font-semibold text-slate-900 dark:text-white">Deliverable #2</h3>
</div>
<div class="flex items-center gap-3">
<span class="text-xs font-medium text-primary">TikTok Video</span>
<button class="text-slate-400 hover:text-red-500 transition-colors">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
<button class="text-slate-400 hover:text-white transition-colors rotate-180">
<span class="material-symbols-outlined text-[20px]">expand_less</span>
</button>
</div>
</div>
<!-- Collapsed content hint -->
<div class="flex gap-4 text-sm text-slate-500 dark:text-slate-400">
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">tag</span> 2</span>
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">event</span> Oct 24</span>
</div>
</div>
<!-- Add Button -->
<button class="group w-full flex items-center justify-center gap-2 py-4 rounded-xl border-2 border-dashed border-slate-300 dark:border-[#2A3B3E] hover:border-primary/50 hover:bg-primary/5 transition-all mb-4">
<span class="bg-primary/20 text-primary rounded-full p-1 transition-transform group-hover:scale-110">
<span class="material-symbols-outlined text-[20px]">add</span>
</span>
<span class="text-sm font-bold text-slate-600 dark:text-[#9db4b9] group-hover:text-primary">Add another deliverable</span>
</button>
</div>
<!-- Sticky Footer -->
<div class="shrink-0 p-4 bg-background-light dark:bg-background-dark border-t border-slate-200 dark:border-white/5 safe-area-bottom">
<button class="w-full bg-primary hover:bg-[#11b5d6] text-white font-bold text-base py-3.5 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
            Next Step
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</body></html>
