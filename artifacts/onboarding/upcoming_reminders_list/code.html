<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Recordatorios - Influencer CRM</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13c8ec",
                        "background-light": "#f6f8f8",
                        "background-dark": "#101f22",
                        "card-dark": "#162629", // Slightly lighter than background-dark for cards
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom checkbox style from example, modified for theme color */
        .custom-checkbox {
            appearance: none;
            background-color: transparent;
            margin: 0;
            font: inherit;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid #3b4f54;
            border-radius: 0.25rem;
            display: grid;
            place-content: center;
            cursor: pointer;
        }
        
        .custom-checkbox::before {
            content: "";
            width: 0.75rem;
            height: 0.75rem;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .custom-checkbox:checked {
            background-color: #13c8ec; /* Primary color */
            border-color: #13c8ec;
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display antialiased selection:bg-primary/30">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden pb-24">
<!-- Top App Bar -->
<header class="sticky top-0 z-10 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
<div class="flex items-center px-4 py-3 justify-between">
<h2 class="text-xl font-bold leading-tight tracking-tight flex-1">Recordatorios</h2>
<div class="flex items-center justify-end">
<button class="flex items-center justify-center rounded-full size-10 bg-primary/10 text-primary active:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-2xl">add</span>
</button>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex flex-col px-4 pt-2">
<!-- Group: Hoy -->
<section class="mt-4">
<div class="flex items-center justify-between pb-3">
<h3 class="text-lg font-bold leading-tight tracking-tight">Hoy</h3>
<span class="text-xs font-medium text-slate-500 dark:text-slate-400 bg-slate-200 dark:bg-white/10 px-2 py-0.5 rounded-full">2</span>
</div>
<div class="flex flex-col gap-3">
<!-- Task Card 1 -->
<div class="group flex items-center gap-4 bg-white dark:bg-card-dark p-4 rounded-xl shadow-sm border border-slate-100 dark:border-white/5 active:scale-[0.99] transition-all duration-200">
<div class="flex size-7 items-center justify-center shrink-0">
<input class="custom-checkbox focus:outline-none focus:ring-2 focus:ring-primary/50 focus:ring-offset-1 focus:ring-offset-background-dark" type="checkbox"/>
</div>
<div class="flex flex-col justify-center flex-1 min-w-0">
<p class="text-base font-medium leading-normal line-clamp-1 group-hover:text-primary transition-colors">Subir Draft de Video</p>
<div class="flex items-center gap-2 mt-1">
<span class="inline-flex items-center rounded-md bg-purple-500/10 px-2 py-0.5 text-xs font-medium text-purple-600 dark:text-purple-400 ring-1 ring-inset ring-purple-500/20">Nike Campaign</span>
</div>
</div>
<div class="shrink-0">
<button class="text-slate-400 dark:text-slate-500 hover:text-primary transition-colors flex items-center justify-center size-8 rounded-full hover:bg-slate-100 dark:hover:bg-white/5">
<span class="material-symbols-outlined text-xl">more_horiz</span>
</button>
</div>
</div>
<!-- Task Card 2 -->
<div class="group flex items-center gap-4 bg-white dark:bg-card-dark p-4 rounded-xl shadow-sm border border-slate-100 dark:border-white/5 active:scale-[0.99] transition-all duration-200">
<div class="flex size-7 items-center justify-center shrink-0">
<input class="custom-checkbox focus:outline-none focus:ring-2 focus:ring-primary/50 focus:ring-offset-1 focus:ring-offset-background-dark" type="checkbox"/>
</div>
<div class="flex flex-col justify-center flex-1 min-w-0">
<p class="text-base font-medium leading-normal line-clamp-1 group-hover:text-primary transition-colors">Enviar Factura</p>
<div class="flex items-center gap-2 mt-1">
<span class="inline-flex items-center rounded-md bg-pink-500/10 px-2 py-0.5 text-xs font-medium text-pink-600 dark:text-pink-400 ring-1 ring-inset ring-pink-500/20">Sephora</span>
</div>
</div>
<div class="shrink-0">
<button class="text-slate-400 dark:text-slate-500 hover:text-primary transition-colors flex items-center justify-center size-8 rounded-full hover:bg-slate-100 dark:hover:bg-white/5">
<span class="material-symbols-outlined text-xl">more_horiz</span>
</button>
</div>
</div>
</div>
</section>
<!-- Group: Mañana -->

<!-- Task Card 3 -->
<div class="group flex items-center gap-4 bg-white dark:bg-card-dark p-4 rounded-xl shadow-sm border border-slate-100 dark:border-white/5 active:scale-[0.99] transition-all duration-200">
<div class="flex size-7 items-center justify-center shrink-0">
<input class="custom-checkbox focus:outline-none focus:ring-2 focus:ring-primary/50 focus:ring-offset-1 focus:ring-offset-background-dark" type="checkbox"/>
</div>
<div class="flex flex-col justify-center flex-1 min-w-0">
<p class="text-base font-medium leading-normal line-clamp-1 group-hover:text-primary transition-colors">Reunión de Briefing</p>
<div class="flex items-center gap-2 mt-1">
<span class="inline-flex items-center rounded-md bg-blue-500/10 px-2 py-0.5 text-xs font-medium text-blue-600 dark:text-blue-400 ring-1 ring-inset ring-blue-500/20">Adidas</span>
<span class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">schedule</span> 10:00 AM
                                </span>
</div>
</div>
<div class="shrink-0">
<button class="text-slate-400 dark:text-slate-500 hover:text-primary transition-colors flex items-center justify-center size-8 rounded-full hover:bg-slate-100 dark:hover:bg-white/5">
<span class="material-symbols-outlined text-xl">more_horiz</span>
</button>
</div>
</div>
</div>

<!-- Group: Esta Semana -->
<section class="mt-8">
<div class="flex items-center justify-between pb-3">

</div>
<div class="flex flex-col gap-3">
<!-- Task Card 4 -->
<div class="group flex items-center gap-4 bg-white dark:bg-card-dark p-4 rounded-xl shadow-sm border border-slate-100 dark:border-white/5 active:scale-[0.99] transition-all duration-200">

<span class="material-symbols-outlined text-xl">more_horiz</span>

</div>
</div>
<!-- Task Card 5 -->
<div class="group flex items-center gap-4 bg-white dark:bg-card-dark p-4 rounded-xl shadow-sm border border-slate-100 dark:border-white/5 active:scale-[0.99] transition-all duration-200">
<div class="flex size-7 items-center justify-center shrink-0">

</div>
<div class="flex flex-col justify-center flex-1 min-w-0">
<p class="text-base font-medium leading-normal line-clamp-1 group-hover:text-primary transition-colors">Responder DM de Agencia</p>
<div class="flex items-center gap-2 mt-1">
<span class="inline-flex items-center rounded-md bg-slate-500/10 px-2 py-0.5 text-xs font-medium text-slate-600 dark:text-slate-400 ring-1 ring-inset ring-slate-500/20">General</span>
</div>
</div>
<div class="shrink-0">
<button class="text-slate-400 dark:text-slate-500 hover:text-primary transition-colors flex items-center justify-center size-8 rounded-full hover:bg-slate-100 dark:hover:bg-white/5">
<span class="material-symbols-outlined text-xl">more_horiz</span>
</button>
</div>
</div>
</div>
</section>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 z-50 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 pb-safe">
<div class="flex justify-around items-center h-16 max-w-md mx-auto px-2">
<a class="flex flex-col items-center justify-center w-full h-full text-slate-500 dark:text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[26px]">home</span>
<span class="text-[10px] mt-1 font-medium">Inicio</span>
</a>
<a class="flex flex-col items-center justify-center w-full h-full text-primary" href="#">
<span class="material-symbols-outlined text-[26px] fill-current">task_alt</span>
<span class="text-[10px] mt-1 font-medium">Tareas</span>
</a>
<!-- Center FAB simulation within Tab Bar -->
<div class="relative -top-5">
<button class="flex items-center justify-center size-14 rounded-full bg-primary shadow-lg shadow-primary/40 text-background-dark transform transition-transform hover:scale-105 active:scale-95">
<span class="material-symbols-outlined text-3xl font-bold">add</span>
</button>
</div>
<a class="flex flex-col items-center justify-center w-full h-full text-slate-500 dark:text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[26px]">handshake</span>
<span class="text-[10px] mt-1 font-medium">Marcas</span>
</a>
<a class="flex flex-col items-center justify-center w-full h-full text-slate-500 dark:text-slate-400 hover:text-primary transition-colors" href="#">
