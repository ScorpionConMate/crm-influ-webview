<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quick Add Contact - Influencer CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13c8ec",
                        "background-light": "#f6f8f8",
                        "background-dark": "#101f22",
                        "surface-light": "#ffffff",
                        "surface-dark": "#18282b",
                        "border-light": "#dbe4e6",
                        "border-dark": "#2a3b3e",
                        "text-main-light": "#111718",
                        "text-main-dark": "#e0e6e7",
                        "text-sub-light": "#618389",
                        "text-sub-dark": "#8a9ea1",
                        "whatsapp": "#25D366" 
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem", 
                        "lg": "0.5rem", 
                        "xl": "0.75rem", 
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>.hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-main-light dark:text-text-main-dark h-screen overflow-hidden flex flex-col antialiased">
<header class="flex-none bg-surface-light dark:bg-surface-dark px-4 py-3 flex items-center justify-center border-b border-border-light dark:border-border-dark relative">
<h1 class="text-lg font-bold tracking-tight">Quick Add Contact</h1>
<button class="absolute right-4 text-text-sub-light dark:text-text-sub-dark hover:text-text-main-light dark:hover:text-text-main-dark p-1">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<main class="flex-1 overflow-y-auto overflow-x-hidden pb-32">
<section class="px-4 pt-6 pb-2">
<div class="bg-primary/5 border border-primary/20 rounded-xl p-3 flex items-start gap-3">
<span class="material-symbols-outlined text-primary mt-0.5">link</span>
<div>
<p class="text-sm font-semibold text-primary">Contextual Link</p>
<p class="text-xs text-text-sub-light dark:text-text-sub-dark mt-0.5">This contact will be automatically linked to the place you are currently creating.</p>
</div>
</div>
</section>
<form class="flex flex-col gap-6 px-4 pt-4">
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-text-main-light dark:text-text-main-dark" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute left-4 top-1/2 -translate-y-1/2 text-text-sub-light dark:text-text-sub-dark flex items-center">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="w-full h-12 rounded-xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark pl-11 pr-4 text-base placeholder:text-text-sub-light dark:placeholder:text-text-sub-dark focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow text-text-main-light dark:text-text-main-dark" id="fullName" placeholder="e.g. Jane Doe" type="text"/>
</div>
</div>
<div class="flex flex-col gap-3">
<label class="text-sm font-semibold text-text-main-light dark:text-text-main-dark">Role</label>
<div class="flex flex-wrap gap-3">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="role" type="radio"/>
<div class="flex items-center gap-2 h-10 px-4 rounded-full bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark text-text-sub-light dark:text-text-sub-dark hover:bg-background-light dark:hover:bg-background-dark/50 transition-all peer-checked:bg-primary/10 peer-checked:border-primary/20 peer-checked:text-primary peer-checked:font-bold">
<span class="material-symbols-outlined text-[20px]">manage_accounts</span>
<span class="text-sm font-medium peer-checked:font-bold">Manager</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="role" type="radio"/>
<div class="flex items-center gap-2 h-10 px-4 rounded-full bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark text-text-sub-light dark:text-text-sub-dark hover:bg-background-light dark:hover:bg-background-dark/50 transition-all peer-checked:bg-primary/10 peer-checked:border-primary/20 peer-checked:text-primary peer-checked:font-bold">
<span class="material-symbols-outlined text-[20px]">storefront</span>
<span class="text-sm font-medium peer-checked:font-bold">Owner</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="role" type="radio"/>
<div class="flex items-center gap-2 h-10 px-4 rounded-full bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark text-text-sub-light dark:text-text-sub-dark hover:bg-background-light dark:hover:bg-background-dark/50 transition-all peer-checked:bg-primary/10 peer-checked:border-primary/20 peer-checked:text-primary peer-checked:font-bold">
<span class="material-symbols-outlined text-[20px]">campaign</span>
<span class="text-sm font-medium peer-checked:font-bold">PR</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="role" type="radio"/>
<div class="flex items-center gap-2 h-10 px-4 rounded-full bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark text-text-sub-light dark:text-text-sub-dark hover:bg-background-light dark:hover:bg-background-dark/50 transition-all peer-checked:bg-primary/10 peer-checked:border-primary/20 peer-checked:text-primary peer-checked:font-bold">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
<span class="text-sm font-medium peer-checked:font-bold">Other</span>
</div>
</label>
</div>
</div>
<div class="flex flex-col gap-4">
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-text-main-light dark:text-text-main-dark" for="phone">Phone Number</label>
<div class="relative">
<input class="w-full h-12 rounded-xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark pl-4 pr-12 text-base placeholder:text-text-sub-light dark:placeholder:text-text-sub-dark focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow text-text-main-light dark:text-text-main-dark" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
<div class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center justify-center h-8 w-8 rounded-full bg-[#25D366]/10">
<span class="material-symbols-outlined text-[18px] text-[#25D366]">chat</span>
</div>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-text-main-light dark:text-text-main-dark" for="email">Email Address</label>
<div class="relative">
<input class="w-full h-12 rounded-xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark pl-4 pr-12 text-base placeholder:text-text-sub-light dark:placeholder:text-text-sub-dark focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow text-text-main-light dark:text-text-main-dark" id="email" placeholder="jane@example.com" type="email"/>
<div class="absolute right-3 top-1/2 -translate-y-1/2 text-text-sub-light dark:text-text-sub-dark pointer-events-none flex items-center">
<span class="material-symbols-outlined text-xl">mail</span>
</div>
</div>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-text-main-light dark:text-text-main-dark" for="notes">Personal Notes</label>
<textarea class="w-full rounded-xl border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark p-4 text-base placeholder:text-text-sub-light dark:placeholder:text-text-sub-dark focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow resize-none text-text-main-light dark:text-text-main-dark" id="notes" placeholder="Met at the launch event, prefers text..." rows="4"></textarea>
</div>
</form>
<div class="h-6"></div>
</main>
<footer class="fixed bottom-0 left-0 right-0 p-4 bg-surface-light/80 dark:bg-surface-dark/80 backdrop-blur-md border-t border-border-light dark:border-border-dark z-10">
<div class="flex gap-3">
<button class="flex-1 h-14 bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark hover:bg-background-light dark:hover:bg-background-dark text-text-sub-light dark:text-text-sub-dark font-bold text-lg rounded-xl flex items-center justify-center transition-all active:scale-[0.98]">
<span>Cancel</span>
</button>
<button class="flex-[2] h-14 bg-primary hover:bg-primary/90 text-white font-bold text-lg rounded-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transition-all active:scale-[0.98]">
<span class="material-symbols-outlined">link</span>
<span>Create &amp; Link</span>
</button>
</div>
</footer>

</body></html>
