<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add New Contact</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13c8ec",
                        "primary-dark": "#0ea6c4",
                        "background-light": "#f6f8f8",
                        "background-dark": "#101f22",
                        "surface-light": "#ffffff",
                        "surface-dark": "#162629",
                        "border-light": "#dbe4e6",
                        "border-dark": "#263639",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "sans": ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111718] dark:text-white transition-colors duration-200">
<div class="relative flex min-h-screen w-full flex-col overflow-hidden pb-24">
<!-- Header -->
<header class="sticky top-0 z-10 flex items-center justify-between bg-surface-light/95 dark:bg-surface-dark/95 backdrop-blur-md p-4 border-b border-border-light dark:border-border-dark">
<button class="text-[#618389] dark:text-[#8eaeb4] text-base font-medium leading-normal tracking-[0.015em] shrink-0 active:opacity-70">
                Cancel
            </button>
<h2 class="text-[#111718] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] absolute left-1/2 transform -translate-x-1/2">
                Add Contact
            </h2>
<div class="w-[50px]"></div> <!-- Spacer to balance layout -->
</header>
<!-- Scrollable Content -->
<main class="flex-1 flex flex-col gap-6 p-4">
<!-- Profile Photo Section -->
<div class="flex flex-col items-center gap-4 py-2">
<div class="relative group cursor-pointer">
<div class="flex items-center justify-center aspect-square h-28 w-28 rounded-full bg-[#e8eef0] dark:bg-[#1e2f33] border-2 border-dashed border-[#aebdce] dark:border-[#3a4f55] hover:border-primary dark:hover:border-primary transition-colors overflow-hidden" data-alt="Avatar placeholder with a silhouette or upload icon">
<span class="material-symbols-outlined text-4xl text-[#618389] dark:text-[#8eaeb4]">add_a_photo</span>
</div>
<!-- Small edit icon badge -->
<div class="absolute bottom-0 right-0 bg-primary rounded-full p-1.5 border-2 border-white dark:border-[#101f22] flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-white text-xs font-bold">edit</span>
</div>
</div>
<div class="text-center">
<p class="text-primary font-semibold text-sm">Upload Photo</p>
</div>
</div>
<!-- Association Section -->
<section class="flex flex-col gap-3">
<h3 class="text-[#111718] dark:text-gray-200 text-sm font-bold uppercase tracking-wider pl-1">Association</h3>
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-[#111718] dark:text-gray-300 ml-1">Link to Place</label>
<div class="relative">
<select class="w-full appearance-none rounded-lg bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark text-[#111718] dark:text-white text-base p-3.5 pr-10 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
<option disabled="" selected="" value="">Select a Place (e.g. The Ivy)</option>
<option value="1">The Ivy Chelsea Garden</option>
<option value="2">Soho House</option>
<option value="3">Sketch London</option>
<option value="4">Dishoom</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-[#618389]">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
</section>
<!-- Details Section -->
<section class="flex flex-col gap-4">
<h3 class="text-[#111718] dark:text-gray-200 text-sm font-bold uppercase tracking-wider pl-1 mt-2">Contact Details</h3>
<!-- Name Input -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-[#111718] dark:text-gray-300 ml-1">Full Name</label>
<input class="w-full rounded-lg bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark text-[#111718] dark:text-white text-base p-3.5 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all placeholder:text-[#9aaeb3] dark:placeholder:text-[#4a5f63]" placeholder="e.g. Sarah Jenkins" type="text"/>
</div>
<!-- Role Selector -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-[#111718] dark:text-gray-300 ml-1">Role</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full text-sm font-medium bg-primary text-white shadow-sm ring-1 ring-primary/20 transition-all hover:brightness-105" type="button">
                            Manager
                        </button>
<button class="px-4 py-2 rounded-full text-sm font-medium bg-[#e8eef0] dark:bg-[#1e2f33] text-[#4a6368] dark:text-[#aebdce] border border-transparent hover:border-primary/30 transition-all" type="button">
                            Owner
                        </button>
<button class="px-4 py-2 rounded-full text-sm font-medium bg-[#e8eef0] dark:bg-[#1e2f33] text-[#4a6368] dark:text-[#aebdce] border border-transparent hover:border-primary/30 transition-all" type="button">
                            PR
                        </button>
<button class="px-4 py-2 rounded-full text-sm font-medium bg-[#e8eef0] dark:bg-[#1e2f33] text-[#4a6368] dark:text-[#aebdce] border border-transparent hover:border-primary/30 transition-all" type="button">
                            Other
                        </button>
</div>
</div>
<!-- Phone Input with WhatsApp Toggle -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-[#111718] dark:text-gray-300 ml-1">Phone Number</label>
<div class="flex gap-2">
<div class="relative flex-1">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#618389] text-[20px]">call</span>
</div>
<input class="w-full rounded-lg bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark text-[#111718] dark:text-white text-base p-3.5 pl-10 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all placeholder:text-[#9aaeb3] dark:placeholder:text-[#4a5f63]" placeholder="+44 7700 900000" type="tel"/>
</div>
<!-- WhatsApp Toggle -->
<div class="flex flex-col justify-center items-center px-2">
<button class="group relative inline-flex h-12 w-12 items-center justify-center rounded-lg border border-border-light dark:border-border-dark bg-surface-light dark:bg-surface-dark transition-all data-[active=true]:border-primary data-[active=true]:bg-primary/5 hover:bg-gray-50 dark:hover:bg-[#1a2c30]" data-active="true" onclick="this.dataset.active = this.dataset.active === 'true' ? 'false' : 'true'" type="button">
<span class="material-symbols-outlined text-[#25D366] text-2xl transition-opacity group-data-[active=false]:opacity-40 group-data-[active=true]:opacity-100">chat</span>
<div class="absolute -top-1 -right-1 h-3 w-3 rounded-full bg-primary ring-2 ring-white dark:ring-[#101f22] opacity-0 group-data-[active=true]:opacity-100 transition-opacity"></div>
</button>
<span class="text-[10px] text-[#618389] dark:text-[#8eaeb4] mt-1 font-medium">WhatsApp</span>
</div>
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-[#111718] dark:text-gray-300 ml-1">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#618389] text-[20px]">mail</span>
</div>
<input class="w-full rounded-lg bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark text-[#111718] dark:text-white text-base p-3.5 pl-10 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all placeholder:text-[#9aaeb3] dark:placeholder:text-[#4a5f63]" placeholder="sarah@example.com" type="email"/>
</div>
</div>
</section>
<!-- Notes Section -->
<section class="flex flex-col gap-3">
<h3 class="text-[#111718] dark:text-gray-200 text-sm font-bold uppercase tracking-wider pl-1 mt-2">Notes</h3>
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-[#111718] dark:text-gray-300 ml-1">Personal Notes</label>
<textarea class="w-full rounded-lg bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark text-[#111718] dark:text-white text-base p-3.5 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all resize-none placeholder:text-[#9aaeb3] dark:placeholder:text-[#4a5f63]" placeholder="Met at launch party, loves spicy food..." rows="4"></textarea>
</div>
</section>
</main>
<!-- Sticky Footer CTA -->
<div class="fixed bottom-0 left-0 right-0 bg-white/80 dark:bg-[#101f22]/80 backdrop-blur-md p-4 border-t border-border-light dark:border-border-dark shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<button class="w-full rounded-lg bg-primary hover:bg-primary-dark text-white font-bold text-lg h-14 shadow-lg shadow-primary/25 transition-all active:scale-[0.99] flex items-center justify-center gap-2">
<span class="material-symbols-outlined">save</span>
                Save Contact
            </button>
</div>
</div>
</body></html>
