<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Visit Notes &amp; Voice Memo</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13c8ec",
                        "background-light": "#f6f8f8",
                        "background-dark": "#101f22",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for horizontal scroll */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Waveform Animation */
        @keyframes wave {
            0%, 100% { height: 20%; }
            50% { height: 100%; }
        }
        .animate-wave {
            animation: wave 1s ease-in-out infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white overflow-x-hidden min-h-screen flex flex-col">
<!-- Sticky Header -->
<header class="sticky top-0 z-50 bg-white/90 dark:bg-[#101f22]/90 backdrop-blur-md border-b border-slate-100 dark:border-slate-800 transition-colors">
<div class="flex items-center justify-between p-4 pb-2">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full active:bg-slate-100 dark:active:bg-slate-800 text-slate-800 dark:text-white transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="flex flex-col items-center flex-1 mx-2">
<h2 class="text-slate-900 dark:text-white text-base font-bold leading-tight tracking-[-0.015em] text-center truncate w-full max-w-[200px]">The Coffee Lab - SoHo</h2>
<p class="text-slate-500 dark:text-slate-400 text-xs font-medium leading-normal">Oct 24, 2:30 PM</p>
</div>
<button class="flex h-10 px-4 items-center justify-center rounded-full bg-primary/10 dark:bg-primary/20 hover:bg-primary/20 dark:hover:bg-primary/30 transition-colors">
<p class="text-primary text-sm font-bold leading-normal tracking-[0.015em]">Save</p>
</button>
</div>
</header>
<main class="flex-1 flex flex-col w-full max-w-md mx-auto px-4 pb-8 space-y-6 pt-4">
<!-- Voice Recorder Module -->
<section class="flex flex-col items-center justify-center bg-white dark:bg-[#18282b] rounded-2xl p-6 shadow-sm border border-slate-100 dark:border-slate-800">
<!-- Timer Display -->
<div class="flex flex-col items-center mb-6">
<div class="flex items-center gap-1">
<span class="size-2 rounded-full bg-red-500 animate-pulse"></span>
<p class="text-slate-400 dark:text-slate-500 text-xs font-semibold uppercase tracking-wider">Ready to Record</p>
</div>
<div class="text-4xl font-bold tracking-tight text-slate-900 dark:text-white mt-1 font-mono">00:00</div>
</div>
<!-- Waveform Visualization (Static/Placeholder state) -->
<div class="h-16 w-full flex items-center justify-center gap-1 px-8 mb-8 opacity-40">
<div class="w-1 bg-primary rounded-full h-3"></div>
<div class="w-1 bg-primary rounded-full h-5"></div>
<div class="w-1 bg-primary rounded-full h-8"></div>
<div class="w-1 bg-primary rounded-full h-4"></div>
<div class="w-1 bg-primary rounded-full h-6"></div>
<div class="w-1 bg-primary rounded-full h-10"></div>
<div class="w-1 bg-primary rounded-full h-12"></div>
<div class="w-1 bg-primary rounded-full h-7"></div>
<div class="w-1 bg-primary rounded-full h-4"></div>
<div class="w-1 bg-primary rounded-full h-8"></div>
<div class="w-1 bg-primary rounded-full h-5"></div>
<div class="w-1 bg-primary rounded-full h-3"></div>
<div class="w-1 bg-primary rounded-full h-6"></div>
<div class="w-1 bg-primary rounded-full h-9"></div>
<div class="w-1 bg-primary rounded-full h-5"></div>
<div class="w-1 bg-primary rounded-full h-3"></div>
</div>
<!-- Hold to Record Button -->
<button class="group relative flex items-center justify-center size-20 rounded-full bg-primary shadow-lg shadow-primary/30 active:scale-95 transition-transform duration-200 cursor-pointer">
<!-- Ripple effect ring -->
<div class="absolute inset-0 rounded-full border-2 border-primary opacity-0 group-active:animate-ping"></div>
<span class="material-symbols-outlined text-white text-4xl group-active:scale-90 transition-transform">mic</span>
</button>
<p class="mt-4 text-slate-500 dark:text-slate-400 text-sm font-medium">Hold to Record Voice Note</p>
</section>
<!-- Quick Field Notes Area -->
<section class="flex flex-col gap-3">
<div class="flex items-center justify-between px-1">
<h3 class="text-slate-900 dark:text-white text-lg font-bold">Quick Field Notes</h3>
<span class="material-symbols-outlined text-slate-400 text-xl cursor-pointer">more_horiz</span>
</div>
<div class="bg-white dark:bg-[#18282b] rounded-xl p-4 shadow-sm border border-slate-100 dark:border-slate-800 min-h-[160px] flex flex-col relative group focus-within:ring-2 focus-within:ring-primary/50 transition-shadow">
<textarea class="w-full bg-transparent border-none p-0 text-slate-700 dark:text-slate-200 text-base leading-relaxed placeholder:text-slate-300 dark:placeholder:text-slate-600 focus:ring-0 resize-none flex-1" placeholder="Jot down key takeaways, pricing, or vibe...">• Great lighting near the window.
• Manager name: Sarah.
• Pricing is slightly higher than competitors.</textarea>
<!-- Formatting Toolbar -->
<div class="flex items-center gap-1 mt-3 pt-3 border-t border-slate-100 dark:border-slate-700">
<button class="p-2 rounded hover:bg-slate-50 dark:hover:bg-white/5 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-xl">format_list_bulleted</span>
</button>
<button class="p-2 rounded hover:bg-slate-50 dark:hover:bg-white/5 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-xl">format_bold</span>
</button>
<button class="p-2 rounded hover:bg-slate-50 dark:hover:bg-white/5 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-xl">tag</span>
</button>
<button class="p-2 rounded hover:bg-slate-50 dark:hover:bg-white/5 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors ml-auto">
<span class="material-symbols-outlined text-xl">mic_none</span>
</button>
</div>
</div>
</section>
<!-- Media Attachment Section -->
<section class="flex flex-col gap-3">
<div class="flex items-center justify-between px-1">
<h3 class="text-slate-900 dark:text-white text-lg font-bold">Visit Visuals</h3>
<span class="text-primary text-sm font-semibold cursor-pointer">View All</span>
</div>
<div class="flex gap-3 overflow-x-auto hide-scrollbar pb-2 -mx-4 px-4 w-[calc(100%+32px)]">
<!-- Add Media Button -->
<button class="shrink-0 size-28 rounded-xl border-2 border-dashed border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-white/5 flex flex-col items-center justify-center gap-2 text-slate-400 dark:text-slate-500 hover:border-primary hover:text-primary hover:bg-primary/5 transition-all">
<span class="material-symbols-outlined text-2xl">add_a_photo</span>
<span class="text-xs font-bold">Add Photo</span>
</button>
<!-- Thumbnail 1 -->
<div class="shrink-0 size-28 relative rounded-xl overflow-hidden group">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Close up of latte art in a ceramic cup" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBWYYCuRcVrxEA8tlK_siQ8C3zfEowB6-MkWeT8_n91sEwZvKGTYLJDcEhvF-7hN2uMYxjQgwY57cxC-QqdsfIHIdcWwtymfUZo-Lh69xVUxOZxldDP4azJnbznlhr3eFs-F-YHVuocT2ouOQx8ErAhlUGerqZET7HWdD77jnMSQmui7wk8Guxj-x85438j2h7EM2_guTmikfO83M7peMXwND9SZkT15e3ISiY-NAoYD8eI4uB7Z7d53QkUm-AaT7kDXqBi5eYRDjg');"></div>
<div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors"></div>
<div class="absolute top-1 right-1 bg-black/50 backdrop-blur-sm rounded-full p-1 text-white opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-sm block">close</span>
</div>
</div>
<!-- Thumbnail 2 -->
<div class="shrink-0 size-28 relative rounded-xl overflow-hidden group">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Interior of a modern coffee shop with wooden tables" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBZ4EdKE9EkjndVUIz0PFkAq-AB-MlESD23frXeKklfNOAGl-xhXfWJDhFknLdLYdsDoWotmjemugE7WhOX9gz0yWgn4DpSBzRsQ2mjGJijBeQFrRX9TrjDuJB16M2aax8SY_UGd20fJpGuhHVJdiS5FjxLoIX-yovbL4soeDOdVVUvbfQnqhn57CUQKajVEk1VNNcyhLICuY96fB7WawEdo9sBgzILT3GLvpiBoyTC4cZbPCbBb8Pu4Q8qd_47XNXG9BJZLT46cH0');"></div>
<div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors"></div>
<div class="absolute top-1 right-1 bg-black/50 backdrop-blur-sm rounded-full p-1 text-white opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-sm block">close</span>
</div>
</div>
<!-- Thumbnail 3 -->
<div class="shrink-0 size-28 relative rounded-xl overflow-hidden group">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Espresso machine brewing coffee shot" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDpEJ3rumiJzdM-ydBjo82Ms2JsLr3BWOhs76B_WASijMe2cMpAr8NyCKKsEO19fTL_8lL8iR98D8-rpkxy3AhOLG3SZU95kt3qTwJN1N1YrJJ1muIfgD0FZzAvpaXlASocV80XqW2wIk52O10ExuS9KcwYDAuzYBtq9Uq-Ox7tEQ_oAIxILsTPipx7RjEExi3tgkqZwAmKHo6tBXFqBlany1-SfQRaeJp0OwPP1Da-aSpqvnZoL7RnPLGw_NlzkpJvdtPOG6CpXus');"></div>
<div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors"></div>
<div class="absolute top-1 right-1 bg-black/50 backdrop-blur-sm rounded-full p-1 text-white opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-sm block">close</span>
</div>
</div>
</div>
</section>
</main>
</body></html>
