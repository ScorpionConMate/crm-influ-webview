<!DOCTYPE html>

<html class="" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>New Deal - General Info</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13c8ec",
                        "background-light": "#f6f8f8",
                        "background-dark": "#101f22",
                        "surface-dark": "#1c2527", // Slightly lighter for inputs
                        "border-dark": "#3b4f54", // Border color from examples
                        "text-muted": "#9db4b9", // Placeholder text
                    },
                    fontFamily: {
                        "display": ["Inter", "Noto Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white min-h-screen flex flex-col antialiased selection:bg-primary/30">
<!-- Top App Bar -->
<header class="flex items-center justify-between px-4 pt-6 pb-2 bg-background-light dark:bg-background-dark sticky top-0 z-20">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-white text-[24px]">close</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center">New Deal</h2>
<div class="flex w-10 items-center justify-end">
<!-- Placeholder for balance -->
</div>
</header>
<!-- Progress Stepper -->
<div class="px-6 py-4 bg-background-light dark:bg-background-dark sticky top-[60px] z-10 border-b border-gray-200 dark:border-white/5 backdrop-blur-md bg-opacity-90 dark:bg-opacity-90">
<div class="flex flex-col gap-2">
<div class="flex w-full flex-row items-center justify-between gap-2">
<!-- Step 1 (Active) -->
<div class="h-1.5 flex-1 rounded-full bg-primary shadow-[0_0_8px_rgba(19,200,236,0.6)]"></div>
<!-- Step 2 -->
<div class="h-1.5 flex-1 rounded-full bg-gray-300 dark:bg-[#3b4f54]"></div>
<!-- Step 3 -->
<div class="h-1.5 flex-1 rounded-full bg-gray-300 dark:bg-[#3b4f54]"></div>
<!-- Step 4 -->
<div class="h-1.5 flex-1 rounded-full bg-gray-300 dark:bg-[#3b4f54]"></div>
</div>
<div class="flex justify-between items-center mt-1">
<span class="text-xs font-semibold text-primary uppercase tracking-wider">Step 1 of 4</span>
<span class="text-xs font-medium text-slate-500 dark:text-text-muted">General Info</span>
</div>
</div>
</div>
<!-- Main Content Form -->
<main class="flex-1 px-4 py-6 flex flex-col gap-6 max-w-lg mx-auto w-full pb-32">
<!-- Headline -->
<div>
<h3 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Let's start with the basics</h3>
<p class="text-slate-500 dark:text-text-muted mt-1 text-sm">Fill in the core details to set up your campaign structure.</p>
</div>
<!-- Field: Deal Title -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-700 dark:text-white" for="deal-title">Deal Title</label>
<div class="relative">
<input class="form-input block w-full rounded-xl border border-gray-200 dark:border-border-dark bg-white dark:bg-surface-dark p-4 text-base focus:border-primary dark:focus:border-primary focus:ring-1 focus:ring-primary dark:text-white placeholder:text-slate-400 dark:placeholder:text-text-muted transition-all shadow-sm" id="deal-title" placeholder="e.g., Summer Brand Launch 2024" type="text"/>
</div>
</div>
<!-- Field: Brand / Place -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-700 dark:text-white" for="brand-select">Place or Brand</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 dark:text-text-muted group-focus-within:text-primary">storefront</span>
</div>
<select class="form-select block w-full rounded-xl border border-gray-200 dark:border-border-dark bg-white dark:bg-surface-dark py-4 pl-12 pr-10 text-base focus:border-primary dark:focus:border-primary focus:ring-1 focus:ring-primary dark:text-white transition-all shadow-sm appearance-none cursor-pointer" id="brand-select">
<option class="text-slate-400 dark:text-text-muted" disabled="" selected="" value="">Search for a brand...</option>
<option value="nike">Nike</option>
<option value="adidas">Adidas</option>
<option value="puma">Puma</option>
<option value="under_armour">Under Armour</option>
</select>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 dark:text-text-muted">expand_more</span>
</div>
</div>
</div>
<!-- Field: Campaign Objective -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-700 dark:text-white" for="objective">Campaign Objective</label>
<textarea class="form-textarea block w-full resize-none rounded-xl border border-gray-200 dark:border-border-dark bg-white dark:bg-surface-dark p-4 text-base focus:border-primary dark:focus:border-primary focus:ring-1 focus:ring-primary dark:text-white placeholder:text-slate-400 dark:placeholder:text-text-muted transition-all shadow-sm" id="objective" placeholder="Describe the main goals, target audience, and key deliverables expected from this partnership..." rows="4"></textarea>
</div>
<!-- Field: Timeline -->
<div class="flex flex-col gap-3">
<label class="text-sm font-medium text-slate-700 dark:text-white">Timeline</label>
<div class="grid grid-cols-2 gap-3">
<!-- Start Date -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 dark:text-text-muted text-[20px]">calendar_today</span>
</div>
<input class="form-input block w-full rounded-xl border border-gray-200 dark:border-border-dark bg-white dark:bg-surface-dark py-3.5 pl-10 pr-3 text-sm focus:border-primary dark:focus:border-primary focus:ring-1 focus:ring-primary dark:text-white placeholder:text-slate-400 dark:placeholder:text-text-muted transition-all shadow-sm" onblur="(this.type='text')" onfocus="(this.type='date')" placeholder="Start Date" type="text"/>
</div>
<!-- End Date -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 dark:text-text-muted text-[20px]">event</span>
</div>
<input class="form-input block w-full rounded-xl border border-gray-200 dark:border-border-dark bg-white dark:bg-surface-dark py-3.5 pl-10 pr-3 text-sm focus:border-primary dark:focus:border-primary focus:ring-1 focus:ring-primary dark:text-white placeholder:text-slate-400 dark:placeholder:text-text-muted transition-all shadow-sm" onblur="(this.type='text')" onfocus="(this.type='date')" placeholder="End Date" type="text"/>
</div>
</div>
<!-- Quick select pills (Bonus UX) -->
<div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
<button class="px-3 py-1.5 rounded-full bg-gray-100 dark:bg-surface-dark border border-gray-200 dark:border-border-dark text-xs font-medium text-slate-600 dark:text-text-muted whitespace-nowrap hover:border-primary hover:text-primary transition-colors">1 Week</button>
<button class="px-3 py-1.5 rounded-full bg-gray-100 dark:bg-surface-dark border border-gray-200 dark:border-border-dark text-xs font-medium text-slate-600 dark:text-text-muted whitespace-nowrap hover:border-primary hover:text-primary transition-colors">2 Weeks</button>
<button class="px-3 py-1.5 rounded-full bg-gray-100 dark:bg-surface-dark border border-gray-200 dark:border-border-dark text-xs font-medium text-slate-600 dark:text-text-muted whitespace-nowrap hover:border-primary hover:text-primary transition-colors">1 Month</button>
<button class="px-3 py-1.5 rounded-full bg-gray-100 dark:bg-surface-dark border border-gray-200 dark:border-border-dark text-xs font-medium text-slate-600 dark:text-text-muted whitespace-nowrap hover:border-primary hover:text-primary transition-colors">Quarter</button>
</div>
</div>
</main>
<!-- Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-white dark:bg-background-dark border-t border-gray-200 dark:border-white/5 p-4 z-50">
<div class="max-w-lg mx-auto flex items-center justify-between gap-4">
<div class="flex flex-col">
<span class="text-[10px] text-slate-400 dark:text-text-muted uppercase font-bold tracking-wider">Next Step</span>
<span class="text-sm font-semibold text-slate-900 dark:text-white">Deliverables</span>
</div>
<button class="bg-primary hover:bg-cyan-400 text-background-dark font-bold text-base px-8 py-3.5 rounded-full shadow-lg shadow-cyan-500/20 active:scale-95 transition-all flex items-center gap-2">
                Next
                <span class="material-symbols-outlined text-[20px] font-bold">arrow_forward</span>
</button>
</div>
</div>
</body></html>
