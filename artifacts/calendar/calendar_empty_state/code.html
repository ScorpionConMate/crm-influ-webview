<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13c8ec",
                        "background-light": "#f6f8f8",
                        "background-dark": "#101f22",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white transition-colors duration-300">
<div class="relative flex h-screen w-full flex-col overflow-hidden max-w-[430px] mx-auto border-x border-slate-200 dark:border-slate-800">
<!-- TopAppBar -->
<header class="flex items-center bg-background-light dark:bg-background-dark p-4 pt-6 justify-between sticky top-0 z-10">
<div class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 cursor-pointer transition-colors">
<span class="material-symbols-outlined text-slate-700 dark:text-white">menu</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-tight flex-1 text-center">Agenda</h2>
<div class="flex size-10 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-slate-700 dark:text-white">search</span>
</div>
</header>
<!-- Main Content Area / Empty State -->
<main class="flex-1 flex flex-col items-center justify-center px-6 text-center">
<!-- Illustration Placeholder -->
<div class="mb-8 relative">
<div class="w-64 h-64 rounded-full bg-primary/10 flex items-center justify-center relative">
<!-- Stylized Clock/Calendar Graphic with Tailwind -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-40 h-40 border-4 border-primary/30 rounded-xl rotate-3 bg-white dark:bg-slate-800 shadow-xl flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-6xl opacity-40">calendar_today</span>
</div>
<div class="absolute w-44 h-44 border-2 border-primary/40 rounded-full -rotate-12 flex items-center justify-center">
<div class="w-2 h-16 bg-primary/60 rounded-full origin-bottom -translate-y-8"></div>
<div class="w-2 h-10 bg-primary/40 rounded-full origin-bottom rotate-90 -translate-x-5 -translate-y-0"></div>
</div>
</div>
</div>
</div>
<!-- Copy Stack -->
<div class="flex flex-col items-center gap-4 max-w-sm">
<h1 class="text-slate-900 dark:text-white text-2xl font-bold tracking-tight">Tu agenda está despejada</h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal leading-relaxed">
                    Agrega fechas de publicación, visitas o recordatorios para tener una visión clara de tu semana.
                </p>
</div>
<!-- Action Buttons -->
<div class="mt-10 flex flex-col gap-3 w-full max-w-xs">
<!-- Primary CTA -->
<button class="flex w-full cursor-pointer items-center justify-center rounded-xl h-14 px-6 bg-primary text-slate-900 text-base font-bold transition-transform active:scale-95 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined mr-2">add_circle</span>
<span>Programar mi primer evento</span>
</button>
<!-- Secondary Option -->
<button class="flex w-full cursor-pointer items-center justify-center rounded-xl h-12 px-6 bg-transparent text-primary text-sm font-semibold hover:bg-primary/5 transition-colors">
<span>Explorar próximos días</span>
</button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="relative border-t border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-[#1c2527]/80 backdrop-blur-md px-4 pb-8 pt-3">
<div class="flex items-center justify-between">
<a class="flex flex-1 flex-col items-center gap-1 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined">home</span>
<p class="text-[10px] font-medium uppercase tracking-wider">Inicio</p>
</a>
<a class="flex flex-1 flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined fill">calendar_month</span>
<p class="text-[10px] font-bold uppercase tracking-wider">Agenda</p>
</a>
<!-- Prominent Circular Center Button -->
<div class="flex-1 flex justify-center -mt-12">
<div class="bg-background-dark dark:bg-background-light p-1.5 rounded-full">
<button class="bg-primary size-14 rounded-full flex items-center justify-center shadow-lg shadow-primary/40 text-slate-900 transition-transform active:scale-90">
<span class="material-symbols-outlined text-3xl font-bold">add</span>
</button>
</div>
</div>
<a class="flex flex-1 flex-col items-center gap-1 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined">chat_bubble</span>
<p class="text-[10px] font-medium uppercase tracking-wider">Mensajes</p>
</a>
<a class="flex flex-1 flex-col items-center gap-1 text-slate-400 dark:text-slate-500" href="#">
<span class="material-symbols-outlined">person</span>
<p class="text-[10px] font-medium uppercase tracking-wider">Perfil</p>
</a>
</div>
</nav>
<!-- iOS Home Indicator -->
<div class="absolute bottom-1.5 left-1/2 -translate-x-1/2 w-32 h-1 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
</div>
</body></html>
